/* =========================================

}

.main-nav {
    list-style: none;

}

.main-nav li a {

}

}

/* =========================================
   3. SECTION TITLE (PEMINJAMAN RUANGAN)
   ========================================= */
.section {
    padding-top: 50px;

}

.section-title {
    margin-bottom: 40px;
}

.section-title .title {
    font-size: 26px;

    color: #2F3542;
    text-transform: uppercase;
    margin: 0;
}

/* =========================================
   4. PRODUCT CARD (Card Foto & Tombol)
   ========================================= */

   /* Memaksa pembungkus utama menjadi flexbox yang bisa di-scroll ke samping */
.products-slick {
    display: flex !important;       /* Menyusun isinya ke samping */
    overflow-x: auto;               /* Memunculkan scrollbar horizontal jika isinya melebihi layar */
    gap: 20px;                      /* Jarak antar card */
    padding-bottom: 20px;           /* Memberi ruang sedikit di bawah untuk scrollbar */
    scroll-snap-type: x mandatory;  /* Membuat efek snapping (berhenti pas di elemen saat digeser) */
    scroll-behavior: smooth;
    -webkit-overflow-scrolling: touch; /* Biar smooth saat digeser di layar sentuh (HP) */
}
/* Mengubah tampilan scrollbar agar lebih tipis dan elegan */
.products-slick::-webkit-scrollbar {
    height: 8px; /* Tinggi scrollbar horizontal */
}
.products-slick::-webkit-scrollbar-track {
    background: #f1f1f1; 
    border-radius: 10px;
}
.products-slick::-webkit-scrollbar-thumb {
    background: #ef233c; /* Warna scrollbar disamakan dengan warna tombol */
    border-radius: 10px;
}
.products-slick::-webkit-scrollbar-thumb:hover {
    background: #D10024; 
}

.product-card {
    background-color: transparent;
    margin-bottom: 30px;
    overflow: hidden; /* Mencegah elemen keluar dari card */
}

.product-image img {
    width: 100%;
    height: 250px; /* Tinggi gambar dibuat pas (seragam) */
    object-fit: cover; /* Agar gambar tidak gepeng */
    display: block;
}

/* Kotak gelap di bagian bawah foto */
.product-action {
    background-color: #1E1F29; /* Sesuai persis dengan gambar, warna kotak gelap */
    padding: 25px;
    text-align: center;
}

/* Tombol Merah Oval (Pill shape) */
.btn-pinjam {
    background-color: #ef233c; /* Warna kemerahan */
    color: #ffffff;
    font-size: 15px;
    font-weight: 700;
    padding: 12px 50px; /* Padding besar agar tombol lebar */
    border-radius: 50px; /* Membuat bentuk obat (oval) */
    border: none;
    cursor: pointer;
    transition: 0.3s background-color, 0.3s transform;
    text-transform: uppercase;
}

.btn-pinjam:hover {
    background-color: #D10024; /* Warnanya lebih gelap saat disorot */
    transform: translateY(-2px); /* Tombol sedikit naik ke atas saat disorot */
}

</style>
