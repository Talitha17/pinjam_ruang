    <script>
      /* ==================================================
         1. FUNGSI KETIKA TOMBOL HIJAU BERHASIL DIKLIK
         (Ini yang sebelumnya hilang sehingga tombol macet)
         ================================================== */
      function pilihJamTersedia(jamDipilih, objekTombol) {
          // Hanya mengisi input Jam Pinjam form di kanan
          document.getElementById('jam_pinjam').value = jamDipilih;
          
          // Mengubah warna tombol untuk menandakan sedang dipilih
          var semuaTombol = document.querySelectorAll('.btn-slot');
          semuaTombol.forEach(function(tombol) {
              // Abaikan tombol yang sedang tergembok (berwarna abu-abu)
              if (tombol.classList.contains('btn-warning') || tombol.classList.contains('btn-success')) {
                  tombol.classList.remove('btn-warning'); 
                  tombol.classList.add('btn-success');    
              }
          });
          
          // Beri warna kuning pada tombol yang sedang Anda klik
          objekTombol.classList.remove('btn-success');
          objekTombol.classList.add('btn-warning'); 
      }

      /* ==================================================
         2. FUNGSI UNTUK MENGIRIM FORM KE GOOGLE SHEETS
         ================================================== */
      function kirimData(event, formObject) {
          event.preventDefault(); 
          
          // Cek proteksi apakah pengguna sudah memencet/memilih jam dari daftar tombol
          if (!document.getElementById('jam_pinjam').value) {
              alert("Peringatan: Anda belum memilih Jam Pinjam! Silakan klik tombol jam yang tersedia di sebelah kiri.");
              return;
          }

          var tombol = document.getElementById("btnSubmit");
          var isiTombolAsli = tombol.innerHTML;
          
          tombol.innerHTML = "<i class='fa fa-spinner fa-spin me-2'></i> Menyimpan...";
          tombol.disabled = true;

          google.script.run
              .withSuccessHandler(function(response) {
                  alert("Permohonan Peminjaman Berhasil Dikirim!");
                  window.top.location.href = "<?= webAppUrl ?>"; 
              })
              .withFailureHandler(function(error) {
                  alert("Gagal mengirim data. Error: " + error.message);
                  tombol.innerHTML = isiTombolAsli;
                  tombol.disabled = false;
              })
              .simpanPeminjam(formObject);
      }

      /* ==================================================
         3. MENGECEK JAM SECARA OTOMATIS SAAT TANGGAL DIPILIH
         ================================================== */
      function cekKetersediaanJam() {
          var kalenderDipilih = document.getElementById('tgl_pinjam').value;
          var idRuang = document.querySelector('input[name="id_ruangan"]').value;
          
          document.getElementById('jam_pinjam').value = ""; // Kosongkan form jam
          var semuaTombol = document.querySelectorAll('.btn-slot');
          
          if (!kalenderDipilih) return;

          // Saat sedang nyari data, ubah sementara angka di tombol jadi logo loading berputar
          semuaTombol.forEach(function(btn) {
              btn.innerHTML = '<i class="fa fa-spinner fa-spin mr-1"></i>';
              btn.disabled = false; // Aktifkan sementara agar klik berfungsi
          });

          // Panggil Google Sheets
          google.script.run
              .withSuccessHandler(function(jadwalTertutup) {
                   var waktuKini = new Date();
                   var formatKini = waktuKini.getFullYear() + "-" + ("0" + (waktuKini.getMonth() + 1)).slice(-2) + "-" + ("0" + waktuKini.getDate()).slice(-2);
                   var isPilihHariIni = (kalenderDipilih === formatKini);
                   
                   semuaTombol.forEach(function(btn) {
                       var teksJam = String(btn.getAttribute('data-jam')).trim();
                       var isSudahLaku = jadwalTertutup.includes(teksJam);
                       var isHangusTerlewat = false;
                       
                       // Cek apakah jam peminjaman sudah lewat dari jam asli hari ini
                       if (isPilihHariIni) {
                           // Pakai regex pembagi titik dua (:) atau titik (.) untuk menghindari error jam 12.00
                           var jamDipisah = teksJam.split(/[:.]/); 
                           var patokanJam = new Date(waktuKini.getFullYear(), waktuKini.getMonth(), waktuKini.getDate(), parseInt(jamDipisah[0]), parseInt(jamDipisah[1]));
                           
                           if (patokanJam <= waktuKini) {
                               isHangusTerlewat = true;
                           }
                       }
                       
                       if (isSudahLaku || isHangusTerlewat) {
                           // TOMBOL DIGEMBOK (Muncul Pop-Up Jika Dipaksa Klik)
                           btn.className = "btn btn-slot w-100 btn-secondary"; 
                           btn.innerHTML = '<i class="fa fa-lock mr-1"></i> ' + teksJam;
                           
                           btn.onclick = function() {
                               if (isSudahLaku) {
                                   alert("Maaf, Jam " + teksJam + " sudah ada peminjam! Silakan pilih jam lain yang berwarna hijau.");
                               } else {
                                   alert("Maaf, Jam " + teksJam + " sudah terlewat waktu! Silakan pilih jam ke depannya.");
                               }
                           };
                       } else {
                           // TOMBOL BISA DIKLIK (Hijau)
                           btn.className = "btn btn-slot w-100 btn-success";
                           btn.innerHTML = '<i class="fa fa-clock-o mr-1"></i> ' + teksJam;
                           
                           // Memberikan perintah klik ke fungsi yang benar
                           btn.onclick = function() {
                              pilihJamTersedia(teksJam, btn);
                           };
                       }
                   });
              })
              .getJamTerpakai(idRuang, kalenderDipilih);
      }
  </script>
