// 1. Logika Grouping (Bawaan JavaScript pengganti foreach PHP yang pertama)
var grouped = {};
for (var i = 0; i < peminjam.length; i++) {
    var p = peminjam[i];
    var namaRuangan = p.nama_ruangan;
    
    if (!grouped[namaRuangan]) {
        grouped[namaRuangan] = [];
    }
    grouped[namaRuangan].push(p);
}

var groupedKeys = Object.keys(grouped);

// 2. Fungsi Helper untuk format tanggal ala PHP (d M Y , H:i)
function formatDate(dateString) {
    if (!dateString) return '-';
    var d = new Date(dateString);
    if (isNaN(d.getTime())) return dateString; // Jika gagal di-parse, kembalikan string aslinya
    
    var months = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Ags', 'Sep', 'Okt', 'Nov', 'Des'];
    var day = ('0' + d.getDate()).slice(-2);
    var month = months[d.getMonth()];
    var year = d.getFullYear();
    var hr = ('0' + d.getHours()).slice(-2);
    var min = ('0' + d.getMinutes()).slice(-2);
    
    return day + ' ' + month + ' ' + year + ' , ' + hr + ':' + min;
}
?>
